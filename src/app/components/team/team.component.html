<section id="equipo" class="team section">
  <div class="container">
    <h2 class="section-title team__title">Nuestro Equipo</h2>
    <p class="section-subtitle team__subtitle">Las personas detrás de Jeepao AI Systems</p>

    <div class="team__grid">
      @for (member of team; track member.name) {
        <article class="team-card">
          <div class="team-card__photo">
            @if (!failedPhotos.has(member.name)) {
              <img
                [src]="member.photo"
                [alt]="member.name"
                class="team-card__img"
                loading="lazy"
                (error)="onImageError(member)"
              />
            } @else {
              <span class="team-card__initials">{{ member.initials }}</span>
            }
          </div>
          <div class="team-card__body">
            <h3>{{ member.name }}</h3>
            <span class="team-card__role">{{ member.role }}</span>
            <p>{{ member.bio }}</p>
            <a
              class="team-card__linkedin"
              [href]="member.linkedin"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'LinkedIn de ' + member.name"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M4.98 3.5C4.98 4.88 3.86 6 2.48 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.24 8.25h4.5V23H.24V8.25zM8.5 8.25h4.32v2.02h.06c.6-1.14 2.07-2.34 4.26-2.34 4.56 0 5.4 3 5.4 6.9V23h-4.5v-6.9c0-1.65-.03-3.77-2.3-3.77-2.3 0-2.65 1.8-2.65 3.65V23H8.5V8.25z"
                />
              </svg>
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
