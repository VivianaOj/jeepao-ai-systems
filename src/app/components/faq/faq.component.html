<section id="faq" class="faq section">
  <div class="container faq__container">
    <h2 class="section-title">Preguntas Frecuentes</h2>
    <p class="section-subtitle">Resolvemos tus dudas antes de empezar</p>

    <div class="faq__list">
      @for (item of items; track item.question; let i = $index) {
        <div class="faq__item" [class.faq__item--open]="openIndex() === i">
          <button class="faq__question" (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i">
            {{ item.question }}
            <span class="faq__icon">{{ openIndex() === i ? '−' : '+' }}</span>
          </button>
          @if (openIndex() === i) {
            <p class="faq__answer">{{ item.answer }}</p>
          }
        </div>
      }
    </div>
  </div>
</section>
